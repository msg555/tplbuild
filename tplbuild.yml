version: "1.0"

base_image_repo: docker.io/msg555/tplbuild-base
stage_image_name: '{{ stage_name }}'
stage_push_name: |
  docker.io/msg555/{{ stage_name }}
  {%- if profile != "release" -%}
    -{{ profile }}
  {%- endif -%}
  {%- if vars.tag is defined -%}
    :{{ vars.tag }}
  {%- endif -%}

dockerfile_syntax: 
  docker/dockerfile:1.4

platforms:
  - linux/amd64
  - linux/arm64

default_profile: dev
profiles:
  dev:
    env: dev
    python_version: '3.12'
  dev_3_11:
    env: dev
    python_version: '3.11'
  dev_3_12:
    env: dev
    python_version: '3.12'
  dev_3_13:
    env: dev
    python_version: '3.13'
  dev_3_14:
    env: dev
    python_version: '3.14'
  dev_3_15:
    env: dev
    python_version: '3.15'
  release:
    env: release
    python_version: '3.12'

contexts:
  default:
    ignore: | # Set 
      *
      !tplbuild
      !requirements*
